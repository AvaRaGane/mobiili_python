<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ale-tutka</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --danger: #ef4444;
      --ok: #22c55e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 14px;
    }
    h1 { font-size: 1.25rem; margin: 0 0 10px; }
    .controls {
      background: var(--card);
      padding: 12px;
      border-radius: 12px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }
    .full { grid-column: 1 / -1; }
    label { font-size: 0.78rem; color: var(--muted); display: block; margin-bottom: 4px; }
    input, select {
      width: 100%;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: var(--text);
      font-size: 0.95rem;
    }
    .row { display: flex; gap: 8px; align-items: center; }
    .row input[type="checkbox"] { width: auto; transform: scale(1.2); }
    #status {
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 12px;
      line-height: 1.4;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 10px;
    }
    .card {
      background: var(--card);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      text-decoration: none;
      color: inherit;
      border: 1px solid #334155;
    }
    .img-wrap {
      position: relative;
      background: #fff;
      height: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .img-wrap img { max-width: 100%; max-height: 100%; object-fit: contain; }
    .badge {
      position: absolute;
      top: 8px;
      left: 8px;
      background: var(--danger);
      color: #fff;
      font-weight: 800;
      font-size: 0.82rem;
      padding: 3px 6px;
      border-radius: 6px;
    }
    .shop-tag {
      position: absolute;
      top: 8px;
      right: 8px;
      font-weight: 800;
      font-size: 0.68rem;
      padding: 3px 6px;
      border-radius: 6px;
      background: #475569;
      color: #fff;
    }
    .shop-EMC24 { background: #0ea5e9; color: #fff; }
    .shop-Moposport { background: #f97316; color: #0f172a; }
    .shop-Hi5Bikes { background: #10b981; color: #0f172a; }
    .shop-Kärkkäinen { background: #f59e0b; color: #0f172a; }
    .shop-Verkkokauppa { background: #e11d48; color: #fff; }
    .info { padding: 10px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
    .title { font-size: 0.84rem; line-height: 1.25; flex: 1; }
    .prices { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
    .sale { font-size: 1.05rem; font-weight: 800; color: var(--ok); }
    .reg { font-size: 0.78rem; color: var(--muted); text-decoration: line-through; }
  </style>
</head>
<body>
  <h1>Ale-tutka</h1>

  <div class="controls">
    <div>
      <label for="shop">Kauppa</label>
      <select id="shop">
        <option value="ALL">Kaikki kaupat</option>
        <option value="EMC24">EMC24</option>
        <option value="Moposport">Moposport</option>
        <option value="Hi5Bikes">Hi5Bikes</option>
        <option value="Kärkkäinen">Kärkkäinen</option>
        <option value="Verkkokauppa.com">Verkkokauppa.com</option>
      </select>
    </div>
    <div>
      <label for="minDisc">Min. alennus (%)</label>
      <input id="minDisc" type="number" value="60" min="1" max="99" />
    </div>
    <div>
      <label for="maxPrice">Max hinta (€)</label>
      <input id="maxPrice" type="number" placeholder="Ei rajaa" min="1" />
    </div>
    <div>
      <label for="sortBy">Järjestys</label>
      <select id="sortBy">
        <option value="disc">Suurin alennus %</option>
        <option value="priceAsc">Halvin ensin</option>
        <option value="priceDesc">Kallein ensin</option>
      </select>
    </div>
    <div class="full">
      <label for="search">Hakusana</label>
      <input id="search" type="text" placeholder="esim. kypärä, makita, rengas..." />
    </div>
    <div class="full row">
      <input id="inStockOnly" type="checkbox" checked />
      <label for="inStockOnly" style="margin:0; color:var(--text);">Näytä vain varastossa olevat</label>
    </div>
  </div>

  <div id="status">Ladataan tarjouksia...</div>
  <div id="results" class="grid"></div>

  <script>
    let rawData = { items: [], updated_at: null, counts: {} };

    const els = {
      shop: document.getElementById("shop"),
      minDisc: document.getElementById("minDisc"),
      maxPrice: document.getElementById("maxPrice"),
      sortBy: document.getElementById("sortBy"),
      search: document.getElementById("search"),
      inStockOnly: document.getElementById("inStockOnly"),
      status: document.getElementById("status"),
      results: document.getElementById("results"),
    };

    function shopClass(name) {
      if (name.startsWith("Verkkokauppa")) return "shop-Verkkokauppa";
      return `shop-${name}`;
    }

    function render() {
      const shop = els.shop.value;
      const minDisc = Number(els.minDisc.value) || 0;
      const maxPrice = els.maxPrice.value ? Number(els.maxPrice.value) : Infinity;
      const q = els.search.value.trim().toLowerCase();
      const inStockOnly = els.inStockOnly.checked;
      const sortBy = els.sortBy.value;

      let list = rawData.items.filter(item => {
        if (shop !== "ALL" && item.shop !== shop) return false;
        if (item.disc < minDisc) return false;
        if (item.sale > maxPrice) return false;
        if (inStockOnly && !item.inStock) return false;
        if (q && !item.name.toLowerCase().includes(q)) return false;
        return true;
      });

      list.sort((a, b) => {
        if (sortBy === "priceAsc") return a.sale - b.sale;
        if (sortBy === "priceDesc") return b.sale - a.sale;
        return b.disc - a.disc || a.sale - b.sale;
      });

      const updated = rawData.updated_at
        ? new Date(rawData.updated_at).toLocaleString("fi-FI")
        : "ei tietoa";

      const breakdown = Object.entries(rawData.counts || {})
        .filter(([k]) => k !== "total")
        .map(([k, v]) => `${k}: ${v}`)
        .join(" | ");

      els.status.textContent =
        `Näytetään ${list.length} / ${rawData.items.length} tuotetta (${breakdown}) • Päivitetty: ${updated}`;

      els.results.innerHTML = list.map(item => `
        <a class="card" href="${item.link}" target="_blank" rel="noopener">
          <div class="img-wrap">
            <span class="badge">-${item.disc}%</span>
            <span class="shop-tag ${shopClass(item.shop)}">${item.shop}</span>
            ${item.img ? `<img src="${item.img}" loading="lazy" alt="">` : ""}
          </div>
          <div class="info">
            <div class="title">${item.name}</div>
            <div class="prices">
              <span class="sale">${item.sale.toFixed(2)} €</span>
              ${item.reg > item.sale ? `<span class="reg">${item.reg.toFixed(2)} €</span>` : ""}
            </div>
          </div>
        </a>
      `).join("");
    }

    Object.values(els).forEach(el => {
      if (el.tagName === "INPUT" || el.tagName === "SELECT") {
        el.addEventListener("input", render);
        el.addEventListener("change", render);
      }
    });

    fetch(`./deals.json?t=${Date.now()}`)
      .then(r => {
        if (!r.ok) throw new Error("deals.json puuttuu vielä — aja GitHub Action ensin!");
        return r.json();
      })
      .then(data => {
        rawData = data;
        render();
      })
      .catch(err => {
        els.status.textContent = `Virhe: ${err.message}`;
      });
  </script>
</body>
</html>
